# Shared infrastructure for every app on this server.
# Start it with:  docker compose up -d
#
# Nothing here is published on the host's ports. Visitors reach Nginx only
# through the Cloudflare tunnels, so the router and UFW stay closed.

name: server

services:
  # The front door. Port 8080 is the production entrance, 8081 the test entrance.
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/routes.inc:/etc/nginx/conf.d/routes.inc:ro
    networks:
      - web

  # Each quick tunnel gets a random https://<words>.trycloudflare.com URL, which
  # changes every time the container restarts. Run ./scripts/urls.sh to see them.
  tunnel-prod:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:8080
    depends_on:
      - nginx
    networks:
      - web

  tunnel-test:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:8081
    depends_on:
      - nginx
    networks:
      - web

networks:
  # Apps join this network so Nginx can reach them by name.
  web:
    name: web
