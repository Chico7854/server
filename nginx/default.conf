# Routes https://<tunnel-url>/<app>/... to the container named <app>-<env>.
#
# Port 8080 is production (tunnel-prod), port 8081 is test (tunnel-test).
# Apps are discovered at request time through Docker's DNS, so adding an app
# never requires changing this file. See README.md for the app contract.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    set $env prod;
    include /etc/nginx/conf.d/routes.inc;
}

server {
    listen 8081;
    set $env test;
    include /etc/nginx/conf.d/routes.inc;
}
