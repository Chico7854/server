# Checks this repo on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose files are valid
        run: |
          docker compose config --quiet
          APP_NAME=my-app APP_ENV=test POSTGRES_PASSWORD=x \
            docker compose -f app-template/docker-compose.yml config --quiet --no-env-resolution

      - name: Shell scripts pass a syntax check
        run: |
          for f in scripts/*.sh tests/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f"
            shellcheck --severity=warning "$f"
          done

      - name: Workflows parse
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.8 -color

  routing-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Front door routes prod and test traffic
        run: ./tests/routing-test.sh

  app-template-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sample app runs through the template in prod and test
        run: ./tests/app-template-test.sh
